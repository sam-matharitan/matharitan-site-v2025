<svg
  width="160"
  height="200"
  viewBox="-10 -10 100 150"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
>
  <defs>
    <linearGradient id="blueFade2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#60c4ff" />
    </linearGradient>
  </defs>

  <!-- Static floating triangles with shadow -->
  <polygon
    points="0,0 40,20 0,40"
    fill="url(#blueFade2)"
    filter="drop-shadow(5px 5px 5px rgba(0,0,0,0.7))"
  />
  <polygon
    points="40,40 80,60 40,80"
    fill="url(#blueFade2)"
    filter="drop-shadow(5px 5px 5px rgba(0,0,0,0.7))"
  />
  <polygon
    points="0,80 40,100 0,120"
    fill="url(#blueFade2)"
    filter="drop-shadow(5px 5px 5px rgba(0,0,0,0.7))"
  />

  <!-- Grounded triangle -->
  <polygon
    points="40,120 80,140 40,140"
    fill="url(#blueFade2)"
  />
</svg>
